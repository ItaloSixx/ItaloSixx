name: assets

on:
  schedule:
    - cron: "17 6 * * *"   # todo dia 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/profile_assets.py"
      - ".github/workflows/assets.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar SVGs a partir da API do GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_USER: ${{ github.repository_owner }}
        run: python scripts/profile_assets.py

      - name: Commit se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/
          git diff --staged --quiet && exit 0
          git commit -m "chore: atualizar cards do perfil [skip ci]"
          git push
